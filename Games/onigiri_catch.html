<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>オニギリキャッチ V3 (BGM付き)</title>
    <style>
        body {
            background-color: #87CEEB;
            font-family: 'Arial', sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            touch-action: none;
            user-select: none;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%); /* 明るい青空 */
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
            z-index: 10;
        }
        .center-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: auto;
            background: rgba(0,0,0,0.5);
            padding: 20px;
            border-radius: 15px;
            width: 80%;
        }
        h1 { margin: 0 0 10px 0; font-size: 28px; color: #ffeb3b; }
        button {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 20px;
            background: #ff4081;
            color: white;
            border: none;
            border-radius: 30px;
            box-shadow: 0 5px 0 #c51162;
            cursor: pointer;
        }
        button:active { transform: translateY(5px); box-shadow: none; }
        
        /* ペナルティ表示 */
        #penaltyMsg {
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #d32f2f;
            font-weight: bold;
            font-size: 24px;
            text-shadow: 2px 2px 0 white;
            opacity: 0;
            transition: opacity 0.1s;
            pointer-events: none;
        }
        
        .touch-guide {
            display: flex;
            width: 100%;
            height: 20%;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        .side-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            margin: 5px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    
    <div id="uiLayer">
        <div class="header">
            <div id="scoreDisplay">🍙: 0</div>
            <div id="lifeDisplay">❤️❤️❤️</div>
        </div>
        
        <div id="penaltyMsg">両手はムリ！😱</div>

        <div id="messageScreen" class="center-msg">
            <h1>🍙 おにぎりキャッチ</h1>
            <p>🎵 音が出ます</p>
            <p>左キー/左タップ → 左手<br>右キー/右タップ → 右手</p>
            <button onclick="startGame()">スタート</button>
        </div>

        <div class="touch-guide" id="touchGuide" style="display:none;">
            <div class="side-btn">👈</div>
            <div class="side-btn">👉</div>
        </div>
    </div>
</div>

<script>
    // --- Web Audio API (BGM生成) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    // シンプルなBGMシーケンサー
    const bgm = {
        isPlaying: false,
        tempo: 120, // BPM
        nextNoteTime: 0,
        noteIndex: 0,
        // Cメジャースケールのベースラインっぽいパターン
        notes: [
            261.63, 261.63, 392.00, 261.63, // C4, C4, G4, C4
            329.63, 329.63, 392.00, 329.63, // E4, E4, G4, E4
            293.66, 293.66, 440.00, 293.66, // D4, D4, A4, D4
            349.23, 349.23, 392.00, 493.88  // F4, F4, G4, B4
        ],
        
        schedule: function() {
            const secondsPerBeat = 60.0 / this.tempo;
            const lookahead = 0.1; // 先読み秒数
            
            while (this.nextNoteTime < audioCtx.currentTime + lookahead) {
                this.playNote(this.notes[this.noteIndex], this.nextNoteTime);
                this.nextNoteTime += secondsPerBeat * 0.5; // 8分音符
                this.noteIndex = (this.noteIndex + 1) % this.notes.length;
            }
            
            if (this.isPlaying) {
                requestAnimationFrame(this.schedule.bind(this));
            }
        },
        
        playNote: function(freq, time) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'square'; // ファミコンっぽい矩形波
            osc.frequency.value = freq;
            
            // エンベロープ（音の減衰）
            gain.gain.setValueAtTime(0.05, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start(time);
            osc.stop(time + 0.1);
        },
        
        start: function() {
            if (this.isPlaying) return;
            this.isPlaying = true;
            this.noteIndex = 0;
            this.nextNoteTime = audioCtx.currentTime + 0.1;
            this.schedule();
        },
        
        stop: function() {
            this.isPlaying = false;
        },
        
        setTempo: function(bpm) {
            this.tempo = bpm;
        }
    };

    // SE（効果音）
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;
        
        if (type === 'catch') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, now); // A5
            osc.frequency.exponentialRampToValueAtTime(1760, now + 0.1); // キラッ
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'miss') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.3); // ブブー
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        }
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
    }


    // --- ゲーム本体 ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const lifeDisplay = document.getElementById('lifeDisplay');
    const messageScreen = document.getElementById('messageScreen');
    const touchGuide = document.getElementById('touchGuide');
    const penaltyMsg = document.getElementById('penaltyMsg');

    function resize() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let gameState = 'title';
    let score = 0;
    let lives = 3;
    let level = 1;
    let animationId;
    let frameCount = 0;

    // プレイヤー（人）
    const player = {
        x: 0, 
        y: 0,
        leftHand: false,
        rightHand: false,
        isConfused: false 
    };

    let onigiris = [];
    const input = { left: false, right: false };

    // 入力処理
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') input.left = true;
        if (e.key === 'ArrowRight') input.right = true;
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') input.left = false;
        if (e.key === 'ArrowRight') input.right = false;
    });

    canvas.addEventListener('touchstart', handleTouch, {passive: false});
    canvas.addEventListener('touchmove', handleTouch, {passive: false});
    canvas.addEventListener('touchend', handleTouch, {passive: false});

    function handleTouch(e) {
        e.preventDefault();
        input.left = false;
        input.right = false;
        const halfWidth = window.innerWidth / 2;
        
        // タッチがある場合のみ判定
        if (e.touches.length > 0) {
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].clientX < halfWidth) input.left = true;
                else input.right = true;
            }
        }
    }

    function startGame() {
        // AudioContextの再開（ブラウザ制限対策）
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        if (animationId) cancelAnimationFrame(animationId);
        
        score = 0;
        lives = 3;
        level = 1;
        frameCount = 0;
        onigiris = [];
        input.left = false;
        input.right = false;
        
        gameState = 'playing';
        messageScreen.style.display = 'none';
        touchGuide.style.display = 'flex';
        
        // BGMスタート（初期テンポ）
        bgm.setTempo(120);
        bgm.start();
        
        updateUI();
        resize();
        loop();
    }

    function updateUI() {
        scoreDisplay.innerText = `🍙: ${score} (Lv.${level})`;
        let lifeStr = '';
        for(let i=0; i<lives; i++) lifeStr += '❤️';
        lifeDisplay.innerText = lifeStr;
    }

    function gameOver() {
        gameState = 'gameover';
        bgm.stop(); // BGM停止
        
        touchGuide.style.display = 'none';
        messageScreen.style.display = 'block';
        messageScreen.innerHTML = `
            <h1 style="color:#ff5252">GAME OVER</h1>
            <p>スコア: ${score}個</p>
            <p>到達レベル: ${level}</p>
            <button onclick="startGame()">もう一回！</button>
        `;
    }

    function spawnOnigiri() {
        // レベルが上がると出現間隔が短くなる（最小15フレーム）
        const baseRate = 80;
        const spawnRate = Math.max(15, baseRate - (level * 6));
        
        if (frameCount % spawnRate === 0) {
            const side = Math.random() < 0.5 ? 'left' : 'right';
            const centerX = canvas.width / 2;
            const offset = canvas.width * 0.25;
            const x = side === 'left' ? centerX - offset : centerX + offset;
            
            // レベルが上がるとスピードアップ
            const speed = 4 + (level * 0.8);
            
            onigiris.push({
                x: x,
                y: -60,
                side: side,
                speed: speed,
                angle: 0,
                rotSpeed: (Math.random() * 0.1 + 0.05) * (Math.random()<0.5?-1:1),
                caught: false
            });
        }
    }

    function update() {
        if (gameState !== 'playing') return;
        
        frameCount++;
        
        // 10個取るごとにレベルアップ（最大レベル20）
        const newLevel = Math.min(20, Math.floor(score / 10) + 1);
        if (newLevel > level) {
            level = newLevel;
            // レベルアップでBGMテンポアップ！（最大180BPM）
            bgm.setTempo(120 + (level * 3)); 
        }

        player.x = canvas.width / 2;
        player.y = canvas.height - 100;

        // 同時押し判定
        if (input.left && input.right) {
            player.isConfused = true;
            player.leftHand = false;
            player.rightHand = false;
            penaltyMsg.style.opacity = 1;
        } else {
            player.isConfused = false;
            player.leftHand = input.left;
            player.rightHand = input.right;
            penaltyMsg.style.opacity = 0;
        }

        spawnOnigiri();

        for (let i = onigiris.length - 1; i >= 0; i--) {
            let o = onigiris[i];
            o.y += o.speed;
            o.angle += o.rotSpeed;

            const catchZoneY = player.y - 40; 
            const catchRange = 70; 

            if (o.y > canvas.height) {
                playSound('miss');
                lives--;
                updateUI();
                onigiris.splice(i, 1);
                if (lives <= 0) gameOver();
                continue;
            }

            if (!o.caught && Math.abs(o.y - catchZoneY) < catchRange) {
                if ((o.side === 'left' && player.leftHand) || 
                    (o.side === 'right' && player.rightHand)) {
                    
                    playSound('catch');
                    score++;
                    updateUI();
                    onigiris.splice(i, 1);
                }
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // --- 背景画 ---
        // 地面（丘）
        ctx.fillStyle = '#81c784';
        ctx.beginPath();
        ctx.ellipse(canvas.width/2, canvas.height, canvas.width, canvas.height * 0.3, 0, 0, Math.PI * 2);
        ctx.fill();

        // レーンガイド
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 4;
        ctx.setLineDash([15, 15]);
        ctx.beginPath();
        ctx.moveTo(canvas.width/2, 0);
        ctx.lineTo(canvas.width/2, canvas.height);
        ctx.stroke();
        ctx.setLineDash([]);

        const px = player.x;
        const py = player.y;
        
        // プレイヤーの体（人）
        ctx.font = "70px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        
        if (player.isConfused) {
            ctx.fillText("😵", px, py); // 混乱顔
        } else {
            // レベルが高くなると必死な顔になる演出
            ctx.fillText(level > 5 ? "😫" : "🧑", px, py); 
        }

        // 左手
        if (player.leftHand) {
            ctx.lineWidth = 12;
            ctx.strokeStyle = "#ffcc80"; // 肌色
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(px - 20, py + 20);
            ctx.lineTo(px - 90, py - 30);
            ctx.stroke();
            
            ctx.font = "40px Arial";
            ctx.fillText("🤚", px - 100, py - 40);
        }

        // 右手
        if (player.rightHand) {
            ctx.lineWidth = 12;
            ctx.strokeStyle = "#ffcc80"; // 肌色
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(px + 20, py + 20);
            ctx.lineTo(px + 90, py - 30);
            ctx.stroke();

            ctx.font = "40px Arial";
            ctx.fillText("🤚", px + 100, py - 40);
        }

        // オニギリ
        for (let o of onigiris) {
            ctx.save();
            ctx.translate(o.x, o.y);
            ctx.rotate(o.angle);
            ctx.shadowColor = "rgba(0,0,0,0.3)";
            ctx.shadowBlur = 5;
            ctx.font = "45px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🍙", 0, 0);
            ctx.restore();
        }
    }

    function loop() {
        update();
        draw();
        if (gameState !== 'gameover') {
            animationId = requestAnimationFrame(loop);
        }
    }

    resize();
    draw();

</script>
</body>
</html>
